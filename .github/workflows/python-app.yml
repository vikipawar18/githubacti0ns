name: python-app
# This is a basic workflow to help you get started with Actions
# triggred on pushes to the default branch and pull requests targeting the default branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      #step number 1
      - name: check out code
      - uses: actions/checkout@v2
      
      #step number 2
      - name: Set up Python 
        uses: actions/setup-python@v2
        with:
          python-version: 3.11
     
      #step number 3 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #step number 4
      - name: Run tests
        run: pytest
